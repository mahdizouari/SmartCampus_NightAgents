name: SmartCampus AI Task
description: Create a sprint task or bonus task for SmartCampus AI (Night Agents)
title: "[SA-XX] "
labels: []
body:
  - type: input
    id: task_id
    attributes:
      label: Task / Story ID
      description: Visiora AI / Backlog code (e.g., SA-28, Bonus-1)
      placeholder: SA-XX
    validations:
      required: true

  - type: dropdown
    id: epic_block
    attributes:
      label: Epic / Block
      options:
        - "SA-1: Architecture & Setup"
        - "SA-11: Modèle Relationnel"
        - "SA-15 & SA-19: Base PostgreSQL & API"
        - "SA-23: Sessions & Auth"
        - "SA-30: Évaluation & Intégration LLM"
        - "Bonus: Prétraitement Multimodal & Extraction IA"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear summary of what needs to be built or verified.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Concrete checklist for when this task is Done.
      value: |
        - [ ] Implementation complete and tested locally
        - [ ] Respects SmartCampus AI design rules (HITL, no invented program facts)
        - [ ] PR reviewed and merged to `main`
    validations:
      required: true

  - type: input
    id: dependencies
    attributes:
      label: Blocked by / Dependencies
      description: List upstream issue numbers or SA codes (e.g., #4, SA-17)
      placeholder: None

